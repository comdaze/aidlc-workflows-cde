# Team Knowledge Hub CI.
#
# One event-driven gate and three scheduled, PROPOSAL-SHAPED jobs. Nothing here
# merges anything: `main` is a protected branch with direct pushes disabled, and
# HUB_BOT_TOKEN is a project access token whose reach ends at pushing a branch
# and opening a merge request. Every automated action therefore lands in the git
# audit trail as a reviewable MR.
#
# Required CI/CD variables:
#   HUB_BOT_TOKEN   masked, protected. Project access token, `api` + `write_repository`.
#                   MUST NOT be allowed to merge — grant Developer, not Maintainer.
#
# Scheduled pipelines to create (Settings → CI/CD → Schedules), each with the
# variable set as shown:
#   weekly   JOB=review-debt
#   weekly   JOB=carry-affirmations
#   monthly  JOB=propose-archive

default:
  image: oven/bun:1
  interruptible: true

stages:
  - gate
  - lifecycle

# --- the gate: every merge request, fail closed --------------------------------

validate-cards:
  stage: gate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # produce mode: BOTH verdict classes reject. This is the same code a spoke
    # runs before it pushes, so a card that reaches review has already passed.
    - bun tools/validate-cards.ts
    # The computed index is a job artifact, never a commit — a committed
    # registry.json would be one shared file every MR rewrites, which is exactly
    # what "one card, one file, never conflicts" cannot survive.
    - bun tools/gen-registry.ts --markdown > registry.md
  artifacts:
    paths:
      - registry.md
    expire_in: 1 week

# --- scheduled: propose, never decide -----------------------------------------

.lifecycle:
  stage: lifecycle
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl >/dev/null
    - git config user.email "hub-bot@example.com"
    - git config user.name "knowledge hub bot"

review-debt:
  extends: .lifecycle
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $JOB == "review-debt"
  script:
    - bun tools/review-debt.ts --horizon 30 > debt.md
    # A quiet week prints NO-DEBT and stops here: no issue update, no noise.
    - grep -q '^NO-DEBT' debt.md && echo "nothing due" && exit 0 || true
    - |
      curl --fail --silent --show-error \
        --header "PRIVATE-TOKEN: $HUB_BOT_TOKEN" \
        --form "title=Knowledge review debt" \
        --form "description=<debt.md" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues" > issue.json
  artifacts:
    paths:
      - debt.md
    expire_in: 1 month

carry-affirmations:
  extends: .lifecycle
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $JOB == "carry-affirmations"
  script:
    - bun tools/carry-affirmations.ts --apply > carried.txt
    - grep -q '^NO-CHANGES' carried.txt && echo "nothing to carry" && exit 0 || true
    - BRANCH="bot/carry-affirmations-$(date -u +%Y-%m-%d)"
    - git checkout -b "$BRANCH"
    - git add -A practices knowledge packs
    - git diff --cached --quiet && echo "no diff after all" && exit 0 || true
    - 'git commit -m "chore(lifecycle): carry spoke affirmations into verified + stale_after"'
    # -o merge_request.create asks for an MR. It does not merge one, and the
    # token is deliberately not permitted to.
    - >
      git push -o merge_request.create
      -o merge_request.title="Carry spoke affirmations"
      -o merge_request.description="Generated by carry-affirmations.ts. Each card gained a verified event and had stale_after recomputed from policy/lifecycle.json. The gate re-checks that the two agree."
      "https://oauth2:$HUB_BOT_TOKEN@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$BRANCH"

propose-archive:
  extends: .lifecycle
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $JOB == "propose-archive"
  script:
    - bun tools/propose-archive.ts --apply > proposed.txt
    - grep -q '^NO-PROPOSAL' proposed.txt && echo "nothing past grace" && exit 0 || true
    - BRANCH="bot/archive-proposal-$(date -u +%Y-%m)"
    - git checkout -b "$BRANCH"
    - git add ARCHIVE-PROPOSAL.md
    - 'git commit -m "chore(lifecycle): propose archival for cards stale past the grace window"'
    # NEVER auto-merged. The job writes a decision list; it does not flip any
    # card's status, because a bare `deprecated` with no successor is rejected by
    # the gate — and would leave readers at a dead end.
    - >
      git push -o merge_request.create
      -o merge_request.title="Archive proposal"
      -o merge_request.description="Generated by propose-archive.ts. For each listed card, pick one: re-affirm, supersede (one MR), or accept the archive with a note. This MR must not be merged as-is."
      "https://oauth2:$HUB_BOT_TOKEN@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$BRANCH"
